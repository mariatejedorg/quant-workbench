schema_version = 1
slug = "options-pricing-implied-volatility-surface"
title = "Options Pricing & Implied Volatility Surface"
folder = "proyecto-6-opciones-volatilidad-implicita"
category = "Advanced models"
order = 60
description = "Black-Scholes and its Greeks from scratch, inverted with Newton-Raphson against a live option chain to draw the volatility smile and surface."
repo_url = "https://github.com/mariatejedorg/options-pricing-implied-volatility-surface"
tags = ["derivatives", "black-scholes"]
depends_on = ["monte-carlo-price-simulator"]

[outputs]
dashboard = "outputs/dashboard.html"
images = ["outputs/volatility_smile.png", "outputs/volatility_surface.png"]
artifacts = []

[[config_targets]]
file = "config/options.py"
symbols = []

[[metrics]]
name = "spot"
pattern = 'Spot:\s*([\d,.]+)'
kind = "float"
unit = ""

[[metrics]]
name = "atm_iv"
pattern = 'sigma \(IV\) = ([\d.]+)%'
kind = "percent"
unit = "%"

[[metrics]]
name = "bs_price"
pattern = 'Precio Black-Scholes:\s*([\d.]+)'
kind = "float"
unit = ""

[[metrics]]
name = "mc_price"
pattern = 'Precio Monte Carlo:\s*([\d.]+)'
kind = "float"
unit = ""

[[metrics]]
name = "bs_vs_mc_diff"
pattern = 'Diferencia relativa:\s*([+-]?[\d.]+)%'
kind = "percent"
unit = "%"

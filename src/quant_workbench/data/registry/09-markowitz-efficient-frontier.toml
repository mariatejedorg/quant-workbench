schema_version = 1
slug = "markowitz-efficient-frontier"
title = "Markowitz Portfolio Optimization"
folder = "proyecto-9-markowitz-frontera-eficiente"
category = "Advanced models"
order = 90
description = "Efficient frontier, minimum-variance and maximum-Sharpe portfolios via constrained optimisation over hand-written return and risk formulas."
repo_url = "https://github.com/mariatejedorg/markowitz-efficient-frontier"
tags = ["optimisation", "portfolio"]
depends_on = []

[outputs]
dashboard = "outputs/dashboard.html"
images = ["outputs/efficient_frontier.png", "outputs/portfolio_weights.png"]
artifacts = []

[[config_targets]]
file = "config/portfolio.py"
symbols = []

[[metrics]]
name = "max_sharpe"
pattern = 'M.ximo Sharpe:\s*[+-]?[\d.]+% / [\d.]+% / (-?[\d.]+)'
kind = "float"
unit = ""

[[metrics]]
name = "min_variance_vol"
pattern = 'M.nima varianza:\s*[+-]?[\d.]+% / ([\d.]+)%'
kind = "percent"
unit = "%"

[[metrics]]
name = "equal_weight_sharpe"
pattern = 'Igual-ponderada:\s*[+-]?[\d.]+% / [\d.]+% / (-?[\d.]+)'
kind = "float"
unit = ""

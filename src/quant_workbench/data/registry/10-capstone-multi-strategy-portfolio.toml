schema_version = 1
slug = "capstone-multi-strategy-portfolio"
title = "Capstone: Multi-Strategy Portfolio"
folder = "proyecto-10-capstone-multi-estrategia"
category = "Advanced models"
order = 100
description = "Momentum signals decide which stocks are in play and Markowitz allocation decides how much each gets, in one monthly-rebalanced backtest."
repo_url = "https://github.com/mariatejedorg/capstone-multi-strategy-portfolio"
tags = ["backtesting", "capstone"]
depends_on = ["momentum-backtest", "markowitz-efficient-frontier"]

[outputs]
dashboard = "outputs/dashboard.html"
images = ["outputs/active_assets.png", "outputs/equity_curves.png"]
artifacts = []

[[config_targets]]
file = "config/multi_strategy.py"
symbols = []

[[metrics]]
name = "strategy_return"
pattern = 'Multi-estrategia: retorno ([+-]?[\d.]+)%'
kind = "percent"
unit = "%"

[[metrics]]
name = "strategy_sharpe"
pattern = 'Multi-estrategia:.*Sharpe ([\d.]+)'
kind = "float"
unit = ""

[[metrics]]
name = "strategy_max_drawdown"
pattern = 'Multi-estrategia:.*drawdown m.x\. (-?[\d.]+)%'
kind = "percent"
unit = "%"

[[metrics]]
name = "equal_weight_max_drawdown"
pattern = 'Igual-ponderada: retorno.*drawdown m.x\. (-?[\d.]+)%'
kind = "percent"
unit = "%"

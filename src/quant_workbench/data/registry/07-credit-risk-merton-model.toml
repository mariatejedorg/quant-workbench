schema_version = 1
slug = "credit-risk-merton-model"
title = "Credit Risk: Merton Structural Model"
folder = "proyecto-7-riesgo-credito-merton"
category = "Advanced models"
order = 70
description = "Equity modelled as a call option on the firm's assets to estimate a real company's distance to default and probability of default."
repo_url = "https://github.com/mariatejedorg/credit-risk-merton-model"
tags = ["credit", "merton"]
depends_on = ["options-pricing-implied-volatility-surface", "monte-carlo-price-simulator"]

[outputs]
dashboard = "outputs/dashboard.html"
images = ["outputs/assets_vs_equity.png", "outputs/default_probability.png"]
artifacts = []

[[config_targets]]
file = "config/credit.py"
symbols = []

[[metrics]]
name = "distance_to_default"
pattern = 'Distance to Default:\s*(-?[\d.]+)'
kind = "float"
unit = ""

[[metrics]]
name = "pd_real_world"
pattern = 'impago real-world:\s*([\d.]+)%'
kind = "percent"
unit = "%"

[[metrics]]
name = "pd_risk_neutral"
pattern = 'impago neutral al riesgo:\s*([\d.]+)%'
kind = "percent"
unit = "%"

[[metrics]]
name = "asset_volatility"
pattern = 'sigma_V\):\s*([\d.]+)%'
kind = "percent"
unit = "%"

schema_version = 1
slug = "momentum-backtest"
title = "Momentum Backtest"
folder = "proyecto-2-momentum-backtest"
category = "Foundations"
order = 20
description = "A 50/200 moving-average crossover backtested from scratch, with a hand-computed Sharpe ratio and no look-ahead bias."
repo_url = "https://github.com/mariatejedorg/momentum-backtest"
tags = ["backtesting", "signals"]
depends_on = []

[outputs]
dashboard = "outputs/dashboard.html"
images = ["outputs/curva_capital.png", "outputs/precio_senales.png"]
artifacts = []

[[config_targets]]
file = "config/strategy.py"
symbols = []

[[metrics]]
name = "strategy_return"
pattern = 'Estrategia \| rentabilidad anual\.: ([+-]?[\d.]+)%'
kind = "percent"
unit = "%"

[[metrics]]
name = "strategy_sharpe"
pattern = 'Estrategia \|.*Sharpe: ([\d.]+)'
kind = "float"
unit = ""

[[metrics]]
name = "strategy_max_drawdown"
pattern = 'Estrategia \|.*max drawdown: (-?[\d.]+)%'
kind = "percent"
unit = "%"

[[metrics]]
name = "benchmark_return"
pattern = 'Benchmark \| rentabilidad anual\.: ([+-]?[\d.]+)%'
kind = "percent"
unit = "%"

[[metrics]]
name = "trades"
pattern = 'Operaciones ejecutadas.*: (\d+)'
kind = "int"
unit = ""

name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    # The headless engine and the CLI: must work with NO Qt installed.
    name: core (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install (no GUI extra on purpose)
        run: python -m pip install -e ".[dev]"
      - name: Lint
        run: ruff check . && ruff format --check .
      - name: Type-check (strict, headless core only)
        # `ui/` needs PySide6's stubs, which this job deliberately does not install (see above);
        # it is type-checked in the `gui` job instead, where the real package is present.
        run: >-
          mypy src/quant_workbench/domain src/quant_workbench/application
          src/quant_workbench/infrastructure src/quant_workbench/cli
          src/quant_workbench/bootstrap.py src/quant_workbench/__init__.py
          src/quant_workbench/__main__.py
      - name: Test with coverage gate
        run: pytest -m "not gui and not network" --cov --cov-report=term-missing --cov-report=xml
      - name: Upload coverage
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.13'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml

  gui:
    # The desktop application, rendered off-screen.
    name: gui (offscreen, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    env:
      QT_QPA_PLATFORM: offscreen
      # --disable-dev-shm-usage: hosted Linux runners cap /dev/shm well below what Chromium wants
      # by default, a well-known cause of renderer crashes in CI containers; harmless elsewhere.
      QTWEBENGINE_CHROMIUM_FLAGS: "--no-sandbox --disable-gpu --disable-dev-shm-usage"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: System libraries required by Qt
        # Only Linux needs this: PySide6's macOS wheels bundle their own Qt/Chromium frameworks,
        # the way its Windows wheels bundle DLLs, but its Linux wheels link against system
        # libraries that are expected to already be on the machine (X11/EGL and friends).
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libdbus-1-3 libnss3 libxcomposite1 \
            libxdamage1 libxrandr2 libxtst6 libasound2t64 libfontconfig1
      - run: python -m pip install -e ".[dev,gui,gui-test]"
      - name: Type-check (strict, full package including ui/)
        run: mypy
      - run: pytest -m gui

  build:
    name: build distributions
    runs-on: ubuntu-latest
    needs: core
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install build twine
      - run: python -m build
      - run: twine check dist/*
